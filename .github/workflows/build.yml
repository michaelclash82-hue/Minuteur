name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler
        run: ./gradlew assembleRelease --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk Minuteur.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Minuteur
          path: Minuteur.apk

      - name: Publier la version (téléchargeable depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Minuteur – version ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: Minuteur.apk
          make_latest: true
